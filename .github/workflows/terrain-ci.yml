name: Terrain-yapici CI

on:
  pull_request:
    paths:
      - "addons/island_terrain/**"
      - "project.godot"
      - ".github/workflows/terrain-ci.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "addons/island_terrain/**"
      - "project.godot"
      - ".github/workflows/terrain-ci.yml"

permissions:
  contents: read

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Engine version
        run: godot --version

      - name: Parse project and load plugin
        run: godot --headless --path . --editor --quit-after 3

      - name: Foundation tests
        run: godot --headless --path . --script addons/island_terrain/test/foundation_test.gd
