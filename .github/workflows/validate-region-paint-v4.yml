name: Validate hardened region paint

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/region-material-paint-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout paint branch
        uses: actions/checkout@v4
        with:
          ref: agent/region-material-paint-v4

      - name: Install Godot 4.6.3
        run: |
          curl -L --fail --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Run paint validation
        id: validation
        shell: bash
        run: |
          set +e
          set -o pipefail
          : > validation.log

          run_godot() {
            ./godot "$@" 2>&1 | tee -a validation.log
            return ${PIPESTATUS[0]}
          }

          code=0
          run_godot --headless --path . --editor --quit-after 3 || code=$?
          if [ "$code" -eq 0 ]; then
            run_godot --headless --path . --script addons/island_terrain/test/material_paint_pipeline_test.gd || code=$?
          fi
          if [ "$code" -eq 0 ] && [ -f addons/island_terrain/test/material_paint_facade_test.gd ]; then
            run_godot --headless --path . --script addons/island_terrain/test/material_paint_facade_test.gd || code=$?
          fi
          if [ "$code" -eq 0 ]; then
            run_godot --headless --path . --script addons/island_terrain/test/material_facade_test.gd || code=$?
          fi
          if [ "$code" -eq 0 ]; then
            run_godot --headless --path . --script addons/island_terrain/test/hardening_facade_test.gd || code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment validation result
        if: always()
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const passed = process.env.EXIT_CODE === '0';
            let body = passed
              ? '✅ Hardened region paint validation passed: parser, paint pipeline, paint facade, material facade and hardening facade are green.'
              : '❌ Hardened region paint validation failed.';
            if (!passed && fs.existsSync('validation.log')) {
              const tail = fs.readFileSync('validation.log', 'utf8').split('\n').slice(-60).join('\n');
              body += `\n\n\`\`\`text\n${tail.slice(0, 20000)}\n\`\`\``;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Enforce validation result
        if: steps.validation.outputs.exit_code != '0'
        run: exit 1
