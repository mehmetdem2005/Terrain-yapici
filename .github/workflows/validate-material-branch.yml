name: Validate material branch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event.comment.body == '/validate-material'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout material branch
        uses: actions/checkout@v4
        with:
          ref: agent/biome-material-system

      - name: Run Godot 4.6.3 validation
        id: validate
        shell: bash
        run: |
          set +e
          : > validation.log
          status=0

          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip \
            >> validation.log 2>&1
          if [ $? -ne 0 ]; then
            status=1
          else
            unzip -q godot.zip >> validation.log 2>&1
            mv Godot_v4.6.3-stable_linux.x86_64 godot >> validation.log 2>&1
            chmod +x godot
          fi

          run_check() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a validation.log
            "$@" 2>&1 | tee -a validation.log
            code=${PIPESTATUS[0]}
            if [ $code -ne 0 ]; then
              status=1
              echo "FAILED: $name ($code)" | tee -a validation.log
            else
              echo "PASSED: $name" | tee -a validation.log
            fi
          }

          if [ -x ./godot ]; then
            run_check 'Engine version' ./godot --version
            run_check 'Project and plugin parser' ./godot --headless --path . --editor --quit-after 3
            run_check 'Foundation tests' ./godot --headless --path . --script addons/island_terrain/test/foundation_test.gd
            run_check 'Sculpt pipeline tests' ./godot --headless --path . --script addons/island_terrain/test/sculpt_pipeline_test.gd
            run_check 'Collision shape test' ./godot --headless --path . --script addons/island_terrain/test/collision_streaming_test.gd -- --case=shape
            run_check 'Collision movement test' ./godot --headless --path . --script addons/island_terrain/test/collision_streaming_test.gd -- --case=movement
            run_check 'Collision dirty rebuild test' ./godot --headless --path . --script addons/island_terrain/test/collision_streaming_test.gd -- --case=dirty
            run_check 'Generation graph tests' ./godot --headless --path . --script addons/island_terrain/test/generation_graph_test.gd
            run_check 'Generation controller tests' ./godot --headless --path . --script addons/island_terrain/test/generation_controller_test.gd
            run_check 'Generation facade tests' ./godot --headless --path . --script addons/island_terrain/test/generation_facade_test.gd
            run_check 'Material system tests' ./godot --headless --path . --script addons/island_terrain/test/material_system_test.gd
            run_check 'Material facade tests' ./godot --headless --path . --script addons/island_terrain/test/material_facade_test.gd
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post validation result
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const passed = process.env.VALIDATION_STATUS === '0';
            let body = passed
              ? '## Biome material validation: PASS\n\n`agent/biome-material-system` passed Godot 4.6.3 parser and all terrain regression tests.'
              : '## Biome material validation: FAIL\n\n`agent/biome-material-system` failed Godot 4.6.3 validation.';
            if (!passed && fs.existsSync('validation.log')) {
              let log = fs.readFileSync('validation.log', 'utf8');
              if (log.length > 50000) log = log.slice(-50000);
              body += `\n\n<details><summary>Validation log</summary>\n\n\`\`\`text\n${log}\n\`\`\`\n</details>`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail workflow when validation failed
        if: steps.validate.outputs.status != '0'
        run: exit 1
