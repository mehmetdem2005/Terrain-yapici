name: Terrain-yapici CI

on:
  pull_request:
    paths:
      - "addons/island_terrain/**"
      - "project.godot"
      - ".github/workflows/terrain-ci.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "addons/island_terrain/**"
      - "project.godot"
      - ".github/workflows/terrain-ci.yml"

permissions:
  contents: write

jobs:
  patch-hardening-facade:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/production-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply guarded facade patch
        run: |
          if grep -q 'const HealthPolicy = preload(' addons/island_terrain/island_terrain_3d.gd; then
            echo 'Facade already patched.'
            exit 0
          fi
          git fetch origin main
          git show origin/main:.github/scripts/patch_hardening_facade.py > /tmp/patch_hardening_facade.py
          python3 /tmp/patch_hardening_facade.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add addons/island_terrain/island_terrain_3d.gd
          git commit -m "Integrate runtime terrain health protection"
          git push origin HEAD:${{ github.head_ref }}

  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        run: |
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Parse project and load plugin
        run: ./godot --headless --path . --editor --quit-after 3

      - name: Foundation tests
        run: ./godot --headless --path . --script addons/island_terrain/test/foundation_test.gd

      - name: Sculpt pipeline tests
        run: ./godot --headless --path . --script addons/island_terrain/test/sculpt_pipeline_test.gd

      - name: Collision shape test
        run: ./godot --headless --path . --script addons/island_terrain/test/collision_streaming_test.gd -- --case=shape

      - name: Collision movement test
        run: ./godot --headless --path . --script addons/island_terrain/test/collision_streaming_test.gd -- --case=movement

      - name: Collision dirty rebuild test
        run: ./godot --headless --path . --script addons/island_terrain/test/collision_streaming_test.gd -- --case=dirty

      - name: Generation graph tests
        run: ./godot --headless --path . --script addons/island_terrain/test/generation_graph_test.gd

      - name: Generation controller tests
        run: ./godot --headless --path . --script addons/island_terrain/test/generation_controller_test.gd

      - name: Generation facade tests
        run: ./godot --headless --path . --script addons/island_terrain/test/generation_facade_test.gd

      - name: Material system tests
        run: ./godot --headless --path . --script addons/island_terrain/test/material_system_test.gd

      - name: Material facade tests
        run: ./godot --headless --path . --script addons/island_terrain/test/material_facade_test.gd

      - name: Production hardening tests
        run: ./godot --headless --path . --script addons/island_terrain/test/production_hardening_test.gd

      - name: Long-session stress tests
        run: ./godot --headless --path . --script addons/island_terrain/test/long_session_stress_test.gd
