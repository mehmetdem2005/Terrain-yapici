name: Build IslandTerrain Test Package

on:
  push:
    branches:
      - agent/testable-demo-package
      - agent/aaa-authoring-tools
  pull_request:
    branches:
      - main
    paths:
      - "addons/island_terrain/**"
      - "demo/**"
      - "editor/**"
      - "project.godot"
      - ".github/workflows/package-test-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        run: |
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Parse project and plugin
        run: ./godot --headless --path . --editor --quit-after 3

      - name: Run stable terrain tests
        run: |
          ./godot --headless --path . --script addons/island_terrain/test/foundation_test.gd
          ./godot --headless --path . --script addons/island_terrain/test/generation_facade_test.gd
          ./godot --headless --path . --script addons/island_terrain/test/material_facade_test.gd
          ./godot --headless --path . --script addons/island_terrain/test/material_paint_facade_test.gd

      - name: Validate runtime demo scene
        run: ./godot --headless --path . --script demo/demo_smoke_test.gd

      - name: Validate editor terrain and sculpt
        run: ./godot --headless --path . --script demo/editor_tools_smoke_test.gd

      - name: Validate AAA authoring tools
        run: ./godot --headless --path . --script demo/aaa_authoring_tools_test.gd

      - name: Create project ZIP
        run: |
          rm -rf package
          mkdir -p package/IslandTerrain-AAA-Authoring
          rsync -a ./ package/IslandTerrain-AAA-Authoring/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.godot' \
            --exclude 'package' \
            --exclude 'godot' \
            --exclude 'godot.zip'
          cd package
          zip -qr ../IslandTerrain-AAA-Authoring-Godot-4.6.3.zip IslandTerrain-AAA-Authoring

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: IslandTerrain-AAA-Authoring
          path: IslandTerrain-AAA-Authoring-Godot-4.6.3.zip
          if-no-files-found: error
          retention-days: 7
