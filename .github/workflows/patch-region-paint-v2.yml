name: Patch region paint v2

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/region-material-paint-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout paint branch
        uses: actions/checkout@v4
        with:
          ref: agent/region-material-paint-v2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply guarded integration
        run: python3 .github/scripts/patch_region_paint_core_v2.py

      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add addons/island_terrain/island_terrain_3d.gd \
            addons/island_terrain/infrastructure/terrain_region_repository.gd \
            addons/island_terrain/rendering/shaders/island_terrain.gdshader
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m "Integrate sparse region material paint core"
          git push origin HEAD:agent/region-material-paint-v2
