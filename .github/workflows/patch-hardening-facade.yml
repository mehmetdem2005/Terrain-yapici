name: Patch production hardening facade

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.comment.body == '/patch-hardening-facade'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply guarded facade integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('addons/island_terrain/island_terrain_3d.gd')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'const MaterialRuntime = preload("res://addons/island_terrain/materials/terrain_material_runtime.gd")\nconst TERRAIN_SHADER',
              '''const MaterialRuntime = preload("res://addons/island_terrain/materials/terrain_material_runtime.gd")
const HealthPolicy = preload("res://addons/island_terrain/diagnostics/terrain_health_policy.gd")
const HealthSnapshot = preload("res://addons/island_terrain/diagnostics/terrain_health_snapshot.gd")
const RuntimeWatchdog = preload("res://addons/island_terrain/diagnostics/terrain_runtime_watchdog.gd")
const RuntimeQualityController = preload("res://addons/island_terrain/diagnostics/terrain_runtime_quality_controller.gd")
const TERRAIN_SHADER'''
          )
          replace_once(
              'signal material_metadata_failed(message: String)\nsignal terrain_edited',
              '''signal material_metadata_failed(message: String)
signal health_snapshot_updated(snapshot: HealthSnapshot)
signal terrain_pressure_changed(level: int, reasons: PackedStringArray)
signal runtime_quality_changed(level: int)
signal terrain_edited'''
          )
          replace_once(
              '@export var memory_budget: MemoryBudget\n@export_range(0, 4, 1) var runtime_shutdown_flush_limit: int = 2',
              '''@export var memory_budget: MemoryBudget
@export var health_policy: HealthPolicy
@export var auto_quality_protection_enabled: bool = true:
\tset = _set_auto_quality_protection_enabled
@export_range(0, 4, 1) var runtime_shutdown_flush_limit: int = 2'''
          )
          replace_once(
              'var _material_runtime: MaterialRuntime\nvar _edit_service: EditService',
              '''var _material_runtime: MaterialRuntime
var _runtime_watchdog: RuntimeWatchdog
var _runtime_quality_controller: RuntimeQualityController
var _edit_service: EditService'''
          )
          replace_once(
              '''func refresh_material_library() -> Error:
\tif _material_runtime == null or _terrain_material == null or memory_budget == null:
\t\treturn ERR_UNCONFIGURED
\t_ensure_material_library()
\treturn _material_runtime.configure(_terrain_material, material_library, memory_budget)


func request_preview_rebuild()''',
              '''func refresh_material_library() -> Error:
\tif _material_runtime == null or _terrain_material == null or memory_budget == null:
\t\treturn ERR_UNCONFIGURED
\t_ensure_material_library()
\tvar error: Error = _material_runtime.configure(_terrain_material, material_library, memory_budget)
\tif error == OK and _runtime_quality_controller != null:
\t\t_runtime_quality_controller.refresh_baseline_from_services()
\treturn error


func get_last_health_snapshot() -> HealthSnapshot:
\treturn _runtime_watchdog.get_last_snapshot() if _runtime_watchdog != null else null


func sample_health_now() -> HealthSnapshot:
\treturn _runtime_watchdog.sample_now() if _runtime_watchdog != null else null


func set_auto_quality_protection_enabled(value: bool) -> void:
\tauto_quality_protection_enabled = value


func get_runtime_quality_reduction() -> int:
\treturn _runtime_quality_controller.current_level() \
\t\tif _runtime_quality_controller != null else 0


func restore_runtime_quality() -> Error:
\treturn _runtime_quality_controller.restore_full_quality() \
\t\tif _runtime_quality_controller != null else ERR_UNCONFIGURED


func request_preview_rebuild()'''
          )
          replace_once(
              '\t_ensure_generation_profile()\n\t_ensure_material_library()\n\tvar errors:',
              '\t_ensure_generation_profile()\n\t_ensure_material_library()\n\t_ensure_health_policy()\n\tvar errors:'
          )
          replace_once(
              '''\tif generate_preview_on_ready:
\t\t_schedule_preview_generation()
\telse:
\t\t_configure_collision_service()
\tterrain_initialized.emit()''',
              '''\tif generate_preview_on_ready:
\t\t_schedule_preview_generation()
\telse:
\t\t_configure_collision_service()
\t\t_configure_runtime_protection()
\tterrain_initialized.emit()'''
          )
          replace_once(
              '\t_generation_controller.configure(manifest, memory_budget, generation_profile)\n\n\tvar material_node:',
              '''\t_generation_controller.configure(
\t\tmanifest,
\t\tmemory_budget,
\t\tgeneration_profile,
\t\tCallable(self, "_metric_resident_memory_bytes")
\t)

\tvar material_node:'''
          )
          replace_once(
              '''\tif material_error != OK:
\t\tpush_error("IT-035: Terrain material runtime configuration failed: %d" % material_error)
\t\treturn false
\treturn true''',
              '''\tif material_error != OK:
\t\tpush_error("IT-035: Terrain material runtime configuration failed: %d" % material_error)
\t\treturn false
\tvar protection_error: Error = _configure_runtime_protection()
\tif protection_error != OK:
\t\tpush_error("IT-037: Runtime protection configuration failed: %d" % protection_error)
\t\treturn false
\treturn true'''
          )
          replace_once(
              '''func _ensure_material_library() -> void:
\tif material_library == null:
\t\tmaterial_library = MaterialLibrary.create_default()
\tmaterial_library.sanitize()


func _create_flat_height_texture()''',
              '''func _ensure_material_library() -> void:
\tif material_library == null:
\t\tmaterial_library = MaterialLibrary.create_default()
\tmaterial_library.sanitize()


func _ensure_health_policy() -> void:
\tif health_policy == null:
\t\thealth_policy = HealthPolicy.new()
\thealth_policy.sanitize()


func _create_flat_height_texture()'''
          )
          replace_once(
              '\t_generation_controller.configure(manifest, memory_budget, generation_profile)\n\tvar error: Error = _generation_controller.start',
              '''\t_generation_controller.configure(
\t\tmanifest,
\t\tmemory_budget,
\t\tgeneration_profile,
\t\tCallable(self, "_metric_resident_memory_bytes")
\t)
\tvar error: Error = _generation_controller.start'''
          )
          replace_once(
              '\t_configure_collision_service()\n\tpreview_generation_progress.emit(1.0)',
              '\t_configure_collision_service()\n\t_configure_runtime_protection()\n\tpreview_generation_progress.emit(1.0)'
          )
          replace_once(
              '''func _on_material_metadata_failed(message: String) -> void:
\tpush_error("IT-036: Terrain material metadata failed: %s" % message)
\tmaterial_metadata_failed.emit(message)


func _configure_collision_service()''',
              '''func _on_material_metadata_failed(message: String) -> void:
\tpush_error("IT-036: Terrain material metadata failed: %s" % message)
\tmaterial_metadata_failed.emit(message)


func _on_health_snapshot_updated(snapshot: HealthSnapshot) -> void:
\thealth_snapshot_updated.emit(snapshot)


func _on_terrain_pressure_changed(level: int, reasons: PackedStringArray) -> void:
\tterrain_pressure_changed.emit(level, reasons)


func _on_runtime_quality_changed(level: int) -> void:
\truntime_quality_changed.emit(level)


func _configure_runtime_protection() -> Error:
\tif _clipmap == null or _collision_service == null or _material_runtime == null:
\t\treturn ERR_UNCONFIGURED
\t_ensure_health_policy()
\tif _runtime_quality_controller == null:
\t\t_runtime_quality_controller = RuntimeQualityController.new()
\tvar quality_error: Error = _runtime_quality_controller.configure(
\t\t_clipmap,
\t\t_collision_service,
\t\t_material_runtime
\t)
\tif quality_error != OK:
\t\treturn quality_error
\tvar watchdog_node: Node = get_node_or_null("__TerrainRuntimeWatchdog")
\tif watchdog_node != null:
\t\t_runtime_watchdog = watchdog_node as RuntimeWatchdog
\t\tif _runtime_watchdog == null:
\t\t\treturn ERR_INVALID_DATA
\telse:
\t\t_runtime_watchdog = RuntimeWatchdog.new()
\t\t_runtime_watchdog.name = "__TerrainRuntimeWatchdog"
\t\tadd_child(_runtime_watchdog, false, Node.INTERNAL_MODE_BACK)
\tvar snapshot_callback := Callable(self, "_on_health_snapshot_updated")
\tvar pressure_callback := Callable(self, "_on_terrain_pressure_changed")
\tvar quality_callback := Callable(self, "_on_runtime_quality_changed")
\tif not _runtime_watchdog.snapshot_updated.is_connected(snapshot_callback):
\t\t_runtime_watchdog.snapshot_updated.connect(snapshot_callback)
\tif not _runtime_watchdog.pressure_changed.is_connected(pressure_callback):
\t\t_runtime_watchdog.pressure_changed.connect(pressure_callback)
\tif not _runtime_watchdog.runtime_quality_changed.is_connected(quality_callback):
\t\t_runtime_watchdog.runtime_quality_changed.connect(quality_callback)
\tvar watchdog_error: Error = _runtime_watchdog.configure(
\t\thealth_policy,
\t\tmemory_budget,
\t\t_runtime_quality_controller,
\t\tCallable(self, "_metric_region_cache_bytes"),
\t\tCallable(self, "_metric_cached_region_count"),
\t\tCallable(self, "_metric_dirty_region_count"),
\t\tCallable(self, "get_generation_working_memory_bytes"),
\t\tCallable(self, "get_material_working_memory_bytes"),
\t\tCallable(self, "_metric_active_clipmap_levels"),
\t\tCallable(self, "_metric_pending_clipmap_levels"),
\t\tCallable(self, "get_active_collision_patch_count"),
\t\tCallable(self, "_metric_pending_collision_builds"),
\t\tCallable(self, "_release_reclaimable_memory")
\t)
\t_runtime_watchdog.set_auto_protection_enabled(
\t\tauto_quality_protection_enabled and not Engine.is_editor_hint()
\t)
\treturn watchdog_error


func _configure_collision_service()'''
          )
          replace_once(
              '''func _queue_collision_transaction(transaction: EditTransaction) -> void:
\tif _collision_service != null and transaction != null:
\t\t_collision_service.queue_transaction(transaction)


func _world_to_image_pixel''',
              '''func _queue_collision_transaction(transaction: EditTransaction) -> void:
\tif _collision_service != null and transaction != null:
\t\t_collision_service.queue_transaction(transaction)


func _metric_region_cache_bytes() -> int:
\treturn _region_repository.cached_memory_bytes() if _region_repository != null else 0


func _metric_cached_region_count() -> int:
\treturn _region_repository.cached_region_count() if _region_repository != null else 0


func _metric_dirty_region_count() -> int:
\treturn _region_repository.dirty_region_count() if _region_repository != null else 0


func _metric_active_clipmap_levels() -> int:
\treturn _clipmap.active_level_count() if _clipmap != null else 0


func _metric_pending_clipmap_levels() -> int:
\treturn _clipmap.pending_level_count() if _clipmap != null else 0


func _metric_pending_collision_builds() -> int:
\treturn _collision_service.pending_build_count() if _collision_service != null else 0


func _metric_resident_memory_bytes() -> int:
\treturn _metric_region_cache_bytes() + get_material_working_memory_bytes()


func _release_reclaimable_memory() -> void:
\tif _region_repository != null:
\t\t_region_repository.clear_clean_cache()
\tif _collision_service != null:
\t\t_collision_service.trim_pool(4)


func _world_to_image_pixel'''
          )
          replace_once(
              '\t\tif _generation_controller != null:\n\t\t\t_generation_controller.configure(manifest, memory_budget, generation_profile)',
              '''\t\tif _generation_controller != null:
\t\t\t_generation_controller.configure(
\t\t\t\tmanifest,
\t\t\t\tmemory_budget,
\t\t\t\tgeneration_profile,
\t\t\t\tCallable(self, "_metric_resident_memory_bytes")
\t\t\t)'''
          )
          replace_once(
              '\t\t_configure_collision_service()\n\t\trequest_preview_rebuild()',
              '\t\t_configure_collision_service()\n\t\t_configure_runtime_protection()\n\t\trequest_preview_rebuild()'
          )
          replace_once(
              '''func _set_collision_enabled(value: bool) -> void:
\tcollision_enabled = value''',
              '''func _set_auto_quality_protection_enabled(value: bool) -> void:
\tauto_quality_protection_enabled = value
\tif _runtime_watchdog != null:
\t\t_runtime_watchdog.set_auto_protection_enabled(
\t\t\tauto_quality_protection_enabled and not Engine.is_editor_hint()
\t\t)


func _set_collision_enabled(value: bool) -> void:
\tcollision_enabled = value'''
          )

          path.write_text(text)
          PY

      - name: Commit hardening facade integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add addons/island_terrain/island_terrain_3d.gd
          git diff --cached --check
          git commit -m "Integrate runtime terrain health protection"
          git push origin HEAD:agent/production-hardening

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '${{ job.status }}' === 'success'
                ? 'Production hardening facade patch completed.'
                : 'Production hardening facade patch failed. Inspect the workflow log.'
            });
