name: Patch foliage facade

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/biome-foliage-streaming'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biome-foliage-streaming
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 .github/scripts/patch_foliage_facade.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add addons/island_terrain/island_terrain_3d.gd
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m "Integrate pooled foliage streaming facade"
          git push origin HEAD:agent/biome-foliage-streaming
