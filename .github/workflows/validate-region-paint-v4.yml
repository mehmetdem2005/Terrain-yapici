name: Validate hardened region paint

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/region-material-paint-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout paint branch
        uses: actions/checkout@v4
        with:
          ref: agent/region-material-paint-v4

      - name: Install Godot 4.6.3
        run: |
          curl -L --fail --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Run paint validation
        id: validation
        shell: bash
        run: |
          set +e
          : > validation.log
          ./godot --headless --path . --editor --quit-after 3 2>&1 | tee -a validation.log
          code=$?
          if [ "$code" -eq 0 ]; then
            ./godot --headless --path . --script addons/island_terrain/test/material_paint_pipeline_test.gd 2>&1 | tee -a validation.log
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            ./godot --headless --path . --script addons/island_terrain/test/material_facade_test.gd 2>&1 | tee -a validation.log
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            ./godot --headless --path . --script addons/island_terrain/test/hardening_facade_test.gd 2>&1 | tee -a validation.log
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment validation result
        if: always()
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('validation.log')
              ? fs.readFileSync('validation.log', 'utf8').split('\n').slice(-120).join('\n')
              : 'validation.log bulunamadı';
            const passed = process.env.EXIT_CODE === '0';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${passed ? '✅' : '❌'} Hardened region paint validation ${passed ? 'passed' : 'failed'}.\n\n\`\`\`text\n${log.slice(0, 50000)}\n\`\`\``
            });

      - name: Enforce validation result
        if: steps.validation.outputs.exit_code != '0'
        run: exit 1
