name: Patch material shader

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.comment.body == '/patch-material-shader'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout material branch
        uses: actions/checkout@v4
        with:
          ref: agent/biome-material-system
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply guarded shader scale patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('addons/island_terrain/rendering/shaders/island_terrain.gdshader')
          text = path.read_text()

          old = '''\tfloat sand_weight = max(biome_match(biome, 1.0), smoothstep(0.0, 0.075, terrain_height_m - sea_level_m) * (1.0 - smoothstep(0.075, 0.13, terrain_height_m - sea_level_m)));'''
          new = '''\tfloat elevation_normalized = clamp(
\t\t(terrain_height_m - sea_level_m) / max(max_height_m, 0.001),
\t\t0.0,
\t\t1.0
\t);
\tfloat beach_band = smoothstep(0.0, 0.035, elevation_normalized)
\t\t* (1.0 - smoothstep(0.035, 0.075, elevation_normalized));
\tfloat sand_weight = max(biome_match(biome, 1.0), beach_band);'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one sand-weight block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old_fallback = '''\tfloat fallback_elevation = smoothstep(0.10, 0.72, (terrain_height_m - sea_level_m) / max(max_height_m, 0.001));'''
          new_fallback = '''\tfloat fallback_elevation = smoothstep(0.10, 0.72, elevation_normalized);'''
          if text.count(old_fallback) != 1:
              raise SystemExit(f'Expected one fallback elevation block, found {text.count(old_fallback)}')
          text = text.replace(old_fallback, new_fallback, 1)

          path.write_text(text)
          PY

      - name: Commit shader patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add addons/island_terrain/rendering/shaders/island_terrain.gdshader
          git diff --cached --check
          git commit -m "Normalize terrain material elevation bands"
          git push origin HEAD:agent/biome-material-system

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '${{ job.status }}' === 'success'
                ? 'Material shader scale patch completed.'
                : 'Material shader scale patch failed. Inspect the workflow log.'
            });
